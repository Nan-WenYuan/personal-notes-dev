name: Publish desktop release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      include_macos:
        description: Also publish the macOS test build
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip already published versions
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          repo = os.environ["GITHUB_REPOSITORY"]
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases/tags/v{version}",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  published = not json.load(response)["draft"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              published = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"published={str(published).lower()}\n")
          print(f"v{version}: already published, skipping duplicate build" if published else f"v{version}: build required")
          PY
  build:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.include_macos && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-portable.ps1 -Type R
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item -LiteralPath '交付/花笺/花笺.exe' -Destination "release-assets/floral-notepaper_${version}_windows_x64_portable.exe"
      - name: Build Apple Silicon application
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/花笺.app"
          codesign --verify --deep --strict "$APP"
          test -x "$APP/Contents/MacOS/floral-notepaper"
          mkdir -p release-assets
          VERSION=$(node -p "require('./package.json').version")
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f -print -quit)
          test -n "$DMG"
          hdiutil verify "$DMG"
          cp "$DMG" "release-assets/floral-notepaper_${VERSION}_macos_aarch64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish both platforms and update manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-desktop-release.py release-assets ${{ inputs.include_macos && '--include-mac' || '' }}
